name: Consullo Pages

on:
  push:
    branches: [codex/public-landing]
    paths:
      - "docs/consullo/**"
      - ".github/workflows/consullo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: consullo-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/consullo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

