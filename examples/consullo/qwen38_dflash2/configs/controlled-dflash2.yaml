kv_cache_config:
  dtype: fp8
  free_gpu_memory_fraction: 0.45
  enable_block_reuse: false
  use_kv_cache_manager_v2: true
  avg_seq_len: 256
return_perf_metrics: true
perf_metrics_max_requests: 1000
enable_iter_perf_stats: true
enable_iter_req_stats: true
batch_wait_timeout_ms: 20
guided_decoding_backend: null
enable_chunked_prefill: true
cuda_graph_config:
  enable_padding: false
  batch_sizes: [1, 2, 4, 8, 12, 15]
  max_batch_size: 15
disable_mm_encoder: true
sampler_type: TRTLLMSampler
speculative_config:
  decoding_type: DFlash
  speculative_model: /path/to/Qwen3.8-27B-DFlash2
  max_draft_len: 7
